<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Learning</title><link rel="stylesheet" href="styles.css"><script defer="defer" src="/neoo_project/static/js/main.c7eaa5d5.js"></script><link href="/neoo_project/static/css/main.102ef2e8.css" rel="stylesheet"></head><body><div class="container"><header><h1>Welcome to Language Learning</h1><p>Learn a new language today!</p></header><section class="language-selection"><label for="learning-language">Choose Language to Learn:</label> <select id="learning-language"><option value="english">English</option><option value="chinese">Chinese</option><option value="japanese">Japanese</option><option value="korean">Korean</option></select> <label for="translation-language">Choose Translation Language:</label> <select id="translation-language"><option value="thai">Thai</option><option value="english">English</option><option value="chinese">Chinese</option><option value="japanese">Japanese</option></select></section><section class="vocabulary-display"><h2>Vocabulary List</h2><div class="vocabulary-card"><img src="image-placeholder.jpg" alt="Vocabulary Image"><p id="word">Word: Hello</p><p id="translation">Translation: สวัสดี</p><button onclick='playAudio("hello")'>Listen to Pronunciation</button></div></section></div><script>function playAudio(e){alert("Playing pronunciation for "+e)}function fetchVocabularyData(e,t){let n="Hello",a="thai"===t?"สวัสดี":"Hello";document.getElementById("word").textContent="Word: "+n,document.getElementById("translation").textContent="Translation: "+a}document.getElementById("learning-language").addEventListener("change",(function(){fetchVocabularyData(this.value,document.getElementById("translation-language").value)})),document.getElementById("translation-language").addEventListener("change",(function(){fetchVocabularyData(document.getElementById("learning-language").value,this.value)}))</script></body></html>
