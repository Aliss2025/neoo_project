<!-- หน้าเริ่มต้นการทดสอบ -->
<div id="start-test">
    <h2>Start Test</h2>
    <form id="test-form">
        <label for="language">Language</label>
        <select id="language" name="language">
            <option value="english">English</option>
            <option value="japanese">Japanese</option>
            <option value="korean">Korean</option>
        </select>

        <label for="difficulty-level">Difficulty Level</label>
        <select id="difficulty-level" name="difficulty-level">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <label for="question-count">Number of Questions</label>
        <input type="number" id="question-count" name="question-count" value="10">

        <button type="submit">Start Test</button>
    </form>
</div>

<!-- หน้าแสดงคำถาม -->
<div id="test-questions">
    <h2>Test Questions</h2>
    <div id="questions-container"></div>
    <button id="submit-test">Submit Test</button>
</div>
